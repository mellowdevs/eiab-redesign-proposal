const LANG_MAP = {DE:'de', ENG:'en', VI:'vi'};
function currentLangFromShared(){
  var stored = (window.EIAB_I18N && window.EIAB_I18N.getLang()) || 'DE';
  return LANG_MAP[stored] || 'de';
}
let currentLang = currentLangFromShared();

function getParams() {
  const params = new URLSearchParams(window.location.search);
  return { id: parseInt(params.get('id')) || 1 };
}

function renderArticle() {
  const { id } = getParams();
  const article = NEWS_ARTICLES[id];

  if (!article) {
    document.getElementById('article').innerHTML = '<p>Artikel nicht gefunden.</p>';
    document.getElementById('article-media').innerHTML = '';
    return;
  }

  const availableLangs = Object.keys(article.title);
  const lang = availableLangs.includes(currentLang) ? currentLang : availableLangs[0];
  const date = new Date(article.date).toLocaleDateString('de-DE', {day: '2-digit', month: '2-digit', year: 'numeric'});

  // Render article
  document.getElementById('article').innerHTML = `
    <div class="article-head">
      <div class="article-date">${date}</div>
      <h1 class="article-title">${article.title[lang]}</h1>
    </div>
    <div class="article-body">
      ${article.body[lang]}
    </div>
  `;

  // Render media placeholder
  document.getElementById('article-media').innerHTML = `
    <span class="caption">EIAB — Waldbröl</span>
  `;

  // Update back button
  document.querySelector('.back').href = 'news.html';
}

window.addEventListener('eiab:langchange', function(e){
  currentLang = LANG_MAP[e.detail.lang] || 'de';
  renderArticle();
});

renderArticle();
</script>
